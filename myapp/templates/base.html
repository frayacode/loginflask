<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Aplikasi Saya{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    nav { display: flex; gap: 1rem; align-items: center; margin-bottom: 1.5rem; }
    .flash { padding: .6rem .9rem; border-radius: 6px; background: #eee; }
    .flash.success { background: #d9f2e0; }
    .flash.danger { background: #f8d7da; }
    .flash.warning { background: #fff3cd; }
    .flash.info { background: #dbeafe; }
    input[type=text], input[type=password] { width: 100%; padding: .4rem; box-sizing: border-box; }
  </style>
</head>
<body>
  <nav>
    <a href="{{ url_for('main.index') }}">Beranda</a>
    {% if current_user.is_authenticated %}
      <a href="{{ url_for('main.dashboard') }}">Dashboard</a>
      <form action="{{ url_for('auth.logout') }}" method="post" style="display:inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit">Logout ({{ current_user.username }})</button>
      </form>
    {% else %}
      <a href="{{ url_for('auth.login') }}">Login</a>
      <a href="{{ url_for('auth.register') }}">Daftar</a>
    {% endif %}
  </nav>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <p class="flash {{ category }}">{{ message }}</p>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</body>
</html>
